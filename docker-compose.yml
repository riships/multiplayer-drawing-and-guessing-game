services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: pictionary-server:latest
    container_name: pictionary-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pictionary-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: pictionary-client:latest
    container_name: pictionary-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
      - "${HTTP_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - pictionary-net

networks:
  pictionary-net:
    driver: bridge
